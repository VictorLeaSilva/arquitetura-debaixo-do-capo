# Configuração do harness SDD deste projeto (T-003). Lido por bash pelos scripts de scripts/.
# Cada chave diz ao gate (scripts/verify-task.sh) e à matriz (scripts/check-traceability.sh) como este projeto funciona.

# Branch principal: a base padrão do diff de cada tarefa.
SDD_PRINCIPAL='main'

# Item 1 do gate: o build completo do backend e o do site (Q-031), os mesmos dos jobs "build" e "site" do CI.
SDD_BUILD_CMD='cd backend && ./mvnw -q -B -ntp verify && cd ../site && npm ci --no-audit --no-fund && npm run verify'

# Item 3 do gate: quais dependências existem em cada revisão. "custom" usa a função sdd_deps_custom abaixo (Q-016).
SDD_DEPS='custom'

# Item 4 e matriz: o que é arquivo de teste (Java, scripts de teste e testes do front-end)...
SDD_TEST_FILES='(^|/)src/test/.*\.java$|^scripts/test/.*\.sh$|^(frontend|site)/.*\.(test|spec)\.(ts|tsx)$'
# ...como a linha que marca o requisito começa (JUnit @Tag e "# covers:" em script, só no começo da linha;
# "[RF-001]" no nome do teste Vitest, em it('...'). Q-018: uma marcação dentro de um texto de exemplo não conta)...
SDD_TAG_LINE='^[[:space:]]*@Tag\(|^[[:space:]]*# covers:|it\(['"'"'"]\[RN?F-'
# ...e o formato do ID do requisito.
SDD_REQ_ID='RN?F-[0-9]{3}'

# Matriz: quais requisitos exigem teste (02 §3) e quais se provam por evidência.
SDD_MANDATORY='RF-0(0[1-9]|10)|RNF-00[12346]|RNF-009|RNF-01[24]'
SDD_EVIDENCE_IDS='RNF-005 RNF-007 RNF-008 RNF-010 RNF-011'

# Item 5 do gate: padrões proibidos em linhas adicionadas de código-fonte (os scripts ficam de fora:
# eles podem imprimir no terminal) e, só nos arquivos de teste, a espera por tempo fixo.
SDD_SRC_FILES='\.(java|ts|tsx)$'
SDD_FORBIDDEN='TODO|FIXME|System\.out\.print|printStackTrace|console\.log|@Disabled|it\.skip\(|describe\.skip\('
SDD_FORBIDDEN_TEST='Thread\.sleep|setTimeout\('

# Q-016: imprime uma coordenada por linha para a revisão $1 (o script ordena e tira as repetidas).
#   pom.xml   → parent, cada <dependency> e cada <plugin>: grupo:artefato:versão (versão declarada no bloco)
#               ou grupo:artefato (versão vinda do BOM). Plugin sem groupId usa org.apache.maven.plugins.
#               O groupId/artifactId/version de <exclusion>, de <configuration> e do próprio projeto não contam.
#   workflows → cada "uses: dono/repo@ref # tag" vira dono/repo@tag (sem comentário, dono/repo@ref).
#   package.json (fora de node_modules) → cada item de dependencies e devDependencies vira nome@versão (Q-031).
sdd_deps_custom() {
  local rev="$1" f
  git ls-tree -r --name-only "$rev" | grep -E '(^|/)pom\.xml$' | while read -r f; do
    git show "$rev:$f" | tr -d '\r' | awk '
      BEGIN { H["dependency"]; H["plugin"]; H["parent"]; H["exclusion"]; H["project"] }
      { s = s $0 " " }
      END {
        # Remove os comentários <!-- ... -->, que podem conter qualquer texto.
        while ((i = index(s, "<!--")) > 0) {
          j = index(substr(s, i), "-->")
          if (j == 0) { s = substr(s, 1, i - 1); break }
          s = substr(s, 1, i - 1) substr(s, i + j + 2)
        }
        depth = 0
        while (match(s, /<[^>]*>/)) {
          texto = substr(s, 1, RSTART - 1); tag = substr(s, RSTART + 1, RLENGTH - 2); s = substr(s, RSTART + RLENGTH)
          gsub(/^[ \t]+|[ \t]+$/, "", texto)
          # O texto pertence ao elemento do topo; só conta se o pai dele guarda coordenadas.
          if (texto != "" && depth > 1) {
            el = st[depth]; pai = st[depth - 1]
            if ((el == "groupId" || el == "artifactId" || el == "version") && (pai in H)) v[depth - 1, el] = texto
          }
          if (tag ~ /^[?!]/ || tag ~ /\/$/) continue          # <?xml ...?> e elementos vazios como <relativePath/>
          if (tag ~ /^\//) {                                  # fecha um elemento
            nome = st[depth]
            if ((nome in H) && nome != "project" && nome != "exclusion") {
              g = v[depth, "groupId"]; a = v[depth, "artifactId"]; ver = v[depth, "version"]
              if (g == "" && nome == "plugin") g = "org.apache.maven.plugins"
              if (g != "" && a != "") print g ":" a (ver != "" ? ":" ver : "")
            }
            v[depth, "groupId"] = ""; v[depth, "artifactId"] = ""; v[depth, "version"] = ""
            depth--
            continue
          }
          split(tag, partes, /[ \t]/)                         # abre um elemento (ignora os atributos)
          depth++; st[depth] = partes[1]
          v[depth, "groupId"] = ""; v[depth, "artifactId"] = ""; v[depth, "version"] = ""
        }
      }'
  done
  git ls-tree -r --name-only "$rev" | grep -E '^\.github/workflows/[^/]+\.ya?ml$' | while read -r f; do
    git show "$rev:$f" | tr -d '\r' | awk '
      /^[ \t-]*uses:[ \t]*[^ \t#]/ {
        linha = $0
        sub(/^[ \t-]*uses:[ \t]*/, "", linha)
        ref = linha; sub(/[ \t#].*$/, "", ref)              # dono/repo@ref
        tagc = ""
        if (match(linha, /#[ \t]*[^ \t]+/)) { tagc = substr(linha, RSTART, RLENGTH); sub(/^#[ \t]*/, "", tagc) }
        if (tagc != "" && index(ref, "@") > 0) { sub(/@.*$/, "", ref); ref = ref "@" tagc }
        print ref
      }'
  done
  git ls-tree -r --name-only "$rev" | grep -E '(^|/)package\.json$' | grep -Ev '(^|/)node_modules/' | while read -r f; do
    # O arquivo vira uma linha só, para aceitar JSON formatado ou compacto.
    git show "$rev:$f" | tr -d '\r\n' | awk '{
      resto = $0
      while (match(resto, /"(dependencies|devDependencies)"[ \t]*:[ \t]*\{[^}]*\}/)) {
        bloco = substr(resto, RSTART, RLENGTH); resto = substr(resto, RSTART + RLENGTH)
        sub(/^[^{]*\{/, "", bloco)
        while (match(bloco, /"[^"]+"[ \t]*:[ \t]*"[^"]*"/)) {
          par = substr(bloco, RSTART, RLENGTH); bloco = substr(bloco, RSTART + RLENGTH)
          nome = par; sub(/^"/, "", nome); sub(/".*$/, "", nome)
          versao = par; sub(/"[ \t]*$/, "", versao); sub(/^.*"/, "", versao)
          print nome "@" versao
        }
      }
    }'
  done
}
