# Contrato da API do laboratório (03 §5), contract-first: este arquivo é a fonte da verdade, e os testes conferem
# cada exemplo e cada resposta real contra os schemas daqui (Q-038). Só as rotas já implementadas (T-011 e T-012).
openapi: 3.1.0
info:
  title: API do Laboratório Arquitetura Debaixo do Capô
  version: 1.0.0
  description: >-
    Lista e detalha os experimentos do laboratório. Roda só na máquina de quem estuda, presa a 127.0.0.1 e sem
    autenticação (D-13). Os erros seguem o Problem Details da RFC 9457 (D-12).
paths:
  /api/v1/lab/experiments:
    get:
      operationId: listExperiments
      summary: Lista os experimentos disponíveis
      responses:
        "200":
          description: Os experimentos, em ordem de id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExperimentSummary"
              examples:
                mvp:
                  summary: Os três experimentos do MVP
                  value:
                    - id: flash-sale-last-units
                      title: Últimas unidades da flash sale
                      summary: Centenas de compradores tentam levar as últimas unidades ao mesmo tempo.
                      studyPage: experimentos/flash-sale-last-units.mdx
                    - id: list-intersection
                      title: Interseção de listas
                      summary: Quantos itens de um lote existem no catálogo?
                      studyPage: experimentos/list-intersection.mdx
                    - id: n-plus-one
                      title: Consultas N+1
                      summary: Uma página de produtos com os atributos de cada um, buscada de três jeitos.
                      studyPage: experimentos/n-plus-one.mdx
  /api/v1/lab/experiments/{experimentId}:
    get:
      operationId: getExperiment
      summary: Devolve o descritor completo de um experimento
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: O descritor, igual ao arquivo lab/experiments/<id>.json.
          content:
            application/json:
              schema:
                $ref: "urn:capo:experiment-descriptor:1"
              examples:
                nPlusOne:
                  summary: O descritor do n-plus-one
                  value:
                    {
                      "schemaVersion": 1,
                      "id": "n-plus-one",
                      "title": "Consultas N+1",
                      "summary": "Uma página de produtos com os atributos de cada um, buscada de três jeitos: um comando SQL por produto, comandos em lotes e um único comando com JOIN. O número de comandos enviados ao banco conta a história.",
                      "studyPage": "experimentos/n-plus-one.mdx",
                      "fairness": "same-result",
                      "variants": [
                        {
                          "id": "bad",
                          "label": "Relação preguiçosa (N+1)",
                          "description": "Busca a página de produtos e, ao ler os atributos de cada um, o Hibernate envia um comando SQL por produto: 1 para a página e mais 1 por produto.",
                          "complexity": "1 + n consultas"
                        },
                        {
                          "id": "medium",
                          "label": "Busca em lotes",
                          "description": "A mesma consulta, com batch fetching de tamanho 25: os atributos chegam em lotes de até 25 produtos por comando.",
                          "complexity": "1 + ⌈n/25⌉ consultas"
                        },
                        {
                          "id": "good",
                          "label": "Uma consulta com JOIN",
                          "description": "Um único comando junta produtos e atributos e devolve direto os dados de que a página precisa, sem passar pelas entidades.",
                          "complexity": "1 consulta"
                        }
                      ],
                      "parameters": [
                        {
                          "name": "pageSizes",
                          "label": "Tamanhos da página (produtos)",
                          "type": "integer-set",
                          "default": [10, 50, 100, 500],
                          "allowed": [10, 50, 100, 500],
                          "isSize": true
                        },
                        {
                          "name": "repetitions",
                          "label": "Repetições por tamanho",
                          "type": "integer",
                          "default": 5,
                          "min": 1,
                          "max": 10
                        }
                      ],
                      "measurements": [
                        { "id": "sqlStatements", "label": "Comandos SQL", "unit": "comandos" },
                        { "id": "durationMsMedian", "label": "Duração (mediana)", "unit": "ms" },
                        { "id": "durationMsMin", "label": "Duração (mínima)", "unit": "ms" },
                        { "id": "durationMsMax", "label": "Duração (máxima)", "unit": "ms" },
                        { "id": "products", "label": "Produtos na página", "unit": "itens" },
                        { "id": "attributes", "label": "Atributos lidos", "unit": "itens" }
                      ],
                      "chart": { "x": "pageSizes", "y": "sqlStatements", "scale": "linear" },
                      "verificationQuestions": [
                        "De onde vem o \"+1\" e de onde vem o \"N\" no nome do problema?",
                        "Por que o batch fetching reduz o número de comandos sem mudar o código que lê os atributos?",
                        "Por que JOIN FETCH com paginação pode ser pior do que parece?",
                        "Por que o número de comandos SQL é uma medida mais estável do que o tempo neste experimento?"
                      ]
                    }
        "404":
          description: Não existe experimento com esse id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  summary: Id inexistente
                  value:
                    type: /problems/experiment-not-found
                    title: Experimento não encontrado
                    status: 404
                    detail: Não existe experimento com o id 'foo'.
                    instance: /api/v1/lab/experiments/foo
  /api/v1/lab/experiments/{experimentId}/runs:
    post:
      operationId: runExperiment
      summary: Executa um experimento e espera o fim (síncrono, D-03)
      description: >-
        Uma execução por vez (D-04). A execução fica gravada e pode ser consultada depois pelo id. Os erros de
        validação do pedido (400, 413 e 422) entram com a T-019.
      parameters:
        - name: experimentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
            examples:
              listIntersection:
                summary: Duas versões em dois tamanhos
                value:
                  variants: [bad, good]
                  parameters:
                    sizes: [1000, 5000]
                    repetitions: 3
      responses:
        "201":
          description: A execução terminou; o corpo é o mesmo do GET da execução.
          headers:
            Location:
              description: O endereço da execução, /api/v1/lab/runs/{id}.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
              examples:
                completed:
                  summary: Execução concluída
                  value:
                    id: 3f1c2a9e-7b4d-4c8a-9e1f-2a6b5c4d3e21
                    experimentId: list-intersection
                    status: COMPLETED
                    startedAt: "2026-11-14T20:00:00Z"
                    finishedAt: "2026-11-14T20:00:02.500Z"
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    environment:
                      javaVersion: 25.0.5+9-LTS
                      springBootVersion: 4.1.2
                      postgresVersion: "18.6"
                      osName: Linux
                      osArch: amd64
                      availableProcessors: 12
                      maxHeapMb: 1024
                      dbPoolSize: 10
                      seedProducts: 1000000
                    parameters:
                      sizes: [1000]
                      repetitions: 3
                    results:
                      - variant: bad
                        size: 1000
                        measurements:
                          durationMsMedian: 4.2
                          matches: 500
                        checksum: 9b74c9897bac770ffc029102a200c5de
                      - variant: good
                        size: 1000
                        measurements:
                          durationMsMedian: 0.1
                          matches: 500
                        checksum: 9b74c9897bac770ffc029102a200c5de
                    fairness:
                      type: same-result
                      sameResult: true
        "404":
          description: Não existe experimento com esse id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  summary: Experimento inexistente
                  value:
                    type: /problems/experiment-not-found
                    title: Experimento não encontrado
                    status: 404
                    detail: Não existe experimento com o id 'foo'.
                    instance: /api/v1/lab/experiments/foo/runs
        "409":
          description: Outra execução segura a trava (D-04).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                inProgress:
                  summary: Execução em andamento
                  value:
                    type: /problems/run-in-progress
                    title: Execução em andamento
                    status: 409
                    detail: Outra execução está em andamento; tente de novo quando ela terminar.
                    instance: /api/v1/lab/experiments/list-intersection/runs
        "500":
          description: A execução falhou e ficou gravada como FAILED. Nunca traz stack trace.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                failed:
                  summary: Exceção durante a execução
                  value:
                    type: /problems/run-failed
                    title: A execução falhou
                    status: 500
                    detail: O motivo está em failureReason, consultando a execução.
                    instance: /api/v1/lab/experiments/list-intersection/runs
                    runId: 3f1c2a9e-7b4d-4c8a-9e1f-2a6b5c4d3e21
  /api/v1/lab/runs/{runId}:
    get:
      operationId: getRun
      summary: Devolve uma execução gravada
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A execução, com o mesmo corpo do 201 que a criou.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
              examples:
                completed:
                  summary: Execução concluída
                  value:
                    id: 3f1c2a9e-7b4d-4c8a-9e1f-2a6b5c4d3e21
                    experimentId: list-intersection
                    status: COMPLETED
                    startedAt: "2026-11-14T20:00:00Z"
                    finishedAt: "2026-11-14T20:00:02.500Z"
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    environment:
                      javaVersion: 25.0.5+9-LTS
                      springBootVersion: 4.1.2
                      postgresVersion: "18.6"
                      osName: Linux
                      osArch: amd64
                      availableProcessors: 12
                      maxHeapMb: 1024
                      dbPoolSize: 10
                      seedProducts: 1000000
                    parameters:
                      sizes: [1000]
                      repetitions: 3
                    results:
                      - variant: good
                        size: 1000
                        measurements:
                          durationMsMedian: 0.1
                          matches: 500
                        checksum: 9b74c9897bac770ffc029102a200c5de
                    fairness:
                      type: same-result
                      sameResult: true
                failed:
                  summary: Execução que falhou
                  value:
                    id: 7d0e8c1b-2f3a-4b5c-8d9e-0a1b2c3d4e5f
                    experimentId: list-intersection
                    status: FAILED
                    startedAt: "2026-11-14T20:05:00Z"
                    finishedAt: "2026-11-14T20:05:00.300Z"
                    traceId: 0af7651916cd43dd8448eb211c80319c
                    environment:
                      javaVersion: 25.0.5+9-LTS
                      springBootVersion: 4.1.2
                      postgresVersion: "18.6"
                      osName: Linux
                      osArch: amd64
                      availableProcessors: 12
                      maxHeapMb: 1024
                      dbPoolSize: 10
                      seedProducts: 1000000
                    parameters:
                      sizes: [1000]
                      repetitions: 3
                    results: null
                    fairness:
                      type: same-result
                    failureReason: falha de exemplo durante a execução
        "400":
          description: O id não é um UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notUuid:
                  summary: Id que não é UUID
                  value:
                    type: /problems/invalid-parameter
                    title: Parâmetro inválido
                    status: 400
                    detail: O id da execução precisa ser um UUID.
                    instance: /api/v1/lab/runs/abc
                    errors:
                      - field: runId
                        message: precisa ser um UUID
        "404":
          description: Não existe execução com esse id.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notFound:
                  summary: Execução inexistente
                  value:
                    type: /problems/run-not-found
                    title: Execução não encontrada
                    status: 404
                    detail: Não existe execução com o id '7d0e8c1b-2f3a-4b5c-8d9e-0a1b2c3d4e50'.
                    instance: /api/v1/lab/runs/7d0e8c1b-2f3a-4b5c-8d9e-0a1b2c3d4e50
components:
  schemas:
    RunRequest:
      type: object
      additionalProperties: false
      required: [variants]
      properties:
        variants:
          type: array
          items:
            type: string
        parameters:
          type: object
    Run:
      type: object
      additionalProperties: false
      required: [id, experimentId, status, startedAt, finishedAt, traceId, environment, parameters, results, fairness]
      properties:
        id:
          type: string
          format: uuid
        experimentId:
          type: string
        status:
          enum: [RUNNING, COMPLETED, FAILED]
        startedAt:
          type: string
        finishedAt:
          type: [string, "null"]
        traceId:
          type: string
          pattern: "^[0-9a-f]{32}$"
        environment:
          type: object
          additionalProperties: false
          required:
            - javaVersion
            - springBootVersion
            - postgresVersion
            - osName
            - osArch
            - availableProcessors
            - maxHeapMb
            - dbPoolSize
            - seedProducts
          properties:
            javaVersion:
              type: string
            springBootVersion:
              type: string
            postgresVersion:
              type: string
            osName:
              type: string
            osArch:
              type: string
            availableProcessors:
              type: integer
            maxHeapMb:
              type: integer
            dbPoolSize:
              type: integer
            seedProducts:
              type: integer
        parameters:
          type: object
        results:
          type: [array, "null"]
          items:
            type: object
            additionalProperties: false
            required: [variant, measurements]
            properties:
              variant:
                type: string
              size:
                type: integer
              measurements:
                type: object
                additionalProperties:
                  type: number
              checksum:
                type: string
        fairness:
          type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              enum: [same-result, demonstrates-error]
            sameResult:
              type: boolean
        failureReason:
          type: string
    ExperimentSummary:
      type: object
      additionalProperties: false
      required: [id, title, summary, studyPage]
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: string
        studyPage:
          type: string
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        runId:
          type: string
