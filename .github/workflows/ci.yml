# CI do projeto (T-002): roda os gates do backend, o detector de segredos e a revisão de dependências.
# Toda action é fixada pelo SHA do commit da tag (a tag fica no comentário): uma tag pode ser movida, o SHA não.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token do workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar o JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Gates do backend (formatação, testes, SpotBugs, cobertura, arquitetura)
        working-directory: backend
        run: ./mvnw -B -ntp verify

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o histórico inteiro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Procurar segredos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Revisar as dependências novas do PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
