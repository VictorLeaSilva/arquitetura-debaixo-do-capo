# CI do projeto (T-002 a T-006): gates do backend, build do site, harness SDD, verificador do compose, detector de segredos e revisão de dependências.
# Toda action é fixada pelo SHA do commit da tag (a tag fica no comentário): uma tag pode ser movida, o SHA não.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O token do workflow só lê o repositório.
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior, que ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar o JDK 25 (Temurin)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Gates do backend (formatação, testes, SpotBugs, cobertura, arquitetura)
        working-directory: backend
        run: ./mvnw -B -ntp verify

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o histórico inteiro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Procurar segredos (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Testes do harness SDD (cenários sintéticos)
        run: bash scripts/test/run-tests.sh
      - name: Testes da configuração do harness (sdd.conf)
        run: bash scripts/test/test-sdd-conf.sh
      - name: Matriz de rastreabilidade em dia
        run: bash scripts/check-traceability.sh --check-file
      - name: Testes do verificador do compose.yaml
        run: bash scripts/test/test-compose-lint.sh
      - name: compose.yaml com imagens fixas e portas só em 127.0.0.1
        run: bash scripts/compose-lint.sh
      - name: Testes do verificador de ADRs
        run: bash scripts/test/test-adr-lint.sh
      - name: Um ADR por decisão, índice e tabela RNF → mecanismo em dia
        run: bash scripts/adr-lint.sh
      - name: Testes do verificador das páginas de estudo
        run: bash scripts/test/test-doc-lint.sh
      - name: Páginas de estudo no padrão DP-05 (seções e abas bash/PowerShell)
        run: bash scripts/doc-lint.sh
      - name: Composes do spike H-05 com imagens fixas e sem portas expostas
        run: |
          bash scripts/compose-lint.sh infra/spike-h05/compose.cassandra.yaml
          bash scripts/compose-lint.sh infra/spike-h05/compose.mongo.yaml
      - name: Sintaxe do compose.yaml (com os valores do .env.example)
        run: cp .env.example .env && docker compose --profile mvp config --quiet

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar o Node da versão fixada em site/.nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Instalar as dependências exatas do package-lock.json
        run: npm ci --no-audit --no-fund
      - name: Tipos, lint, formatação e build do site
        run: npm run verify
      - name: Link interno quebrado derruba o build
        run: bash ../scripts/test/test-site-build.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Revisar as dependências novas do PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
